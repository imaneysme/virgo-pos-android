plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.virgokomputer.pos'
    compileSdk 34

    defaultConfig {
        applicationId "com.virgokomputer.pos"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-ktx:1.9.2'
    // Lets the WebView serve local files over a "secure" virtual https domain,
    // which is required for the camera (getUserMedia) to work for barcode scanning.
    implementation 'androidx.webkit:webkit:1.12.1'
    // Offline barcode scanner activity used as a fallback when in-page camera scanning
    // isn't available on a given device.
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
}
